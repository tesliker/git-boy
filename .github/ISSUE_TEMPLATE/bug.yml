name: Bug report
description: Something is not working in Git Boy.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS native app, Windows preview, Download website, Codex integration]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Git Boy version and OS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a disposable repository when possible. Do not include private code, tokens, personal paths, or customer information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
